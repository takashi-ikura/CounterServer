<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Flask App</title>
    <style>
        /* 簡単な2カラムレイアウトのCSS */
        body { display: flex; margin: 0; height: 100vh; font-family: sans-serif; }
        
        /* 左側のサイドバー */
        .sidebar {
            width: 200px;
            background-color: #333;
            color: white;
            padding: 20px;
        }
        .sidebar a { display: block; color: white; margin-bottom: 10px; text-decoration: none; }
        .sidebar a:hover { color: #ffdd00; }

        /* 右側のメインコンテンツ */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>機能一覧</h2>
        <a href="{{ url_for('counter') }}">カウンター</a>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
